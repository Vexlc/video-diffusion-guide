<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 265" role="img" aria-label="流匹配单题：起点、插值点、终点与速度标签" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>流匹配单题：起点、插值点、终点与速度标签</title><rect x="0" y="0" width="660" height="265" rx="0" fill="#fbfcf8"/><text x="15" y="26" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">一张训练题：只看运动系数这一维</text><line x1="36" y1="107" x2="628" y2="107" stroke="#c8d7d0" stroke-width="3" stroke-dasharray="none"/><circle cx="94.5" cy="107" r="6" fill="#495f66"/><line x1="94.5" y1="107" x2="94.5" y2="135" stroke="#495f66" stroke-width="1" stroke-dasharray="none"/><text x="94.5" y="150" font-size="15" fill="#495f66" text-anchor="middle" font-weight="700">起点 z = −0.5</text><circle cx="212.5" cy="107" r="6" fill="#00695f"/><line x1="212.5" y1="107" x2="212.5" y2="82" stroke="#00695f" stroke-width="1" stroke-dasharray="none"/><text x="212.5" y="75" font-size="15" fill="#00695f" text-anchor="middle" font-weight="700">此刻 x = −0.1</text><circle cx="566.5" cy="107" r="6" fill="#ad492c"/><line x1="566.5" y1="107" x2="566.5" y2="135" stroke="#ad492c" stroke-width="1" stroke-dasharray="none"/><text x="566.5" y="150" font-size="15" fill="#ad492c" text-anchor="middle" font-weight="700">终点 y = 1.1</text><rect x="15" y="177" width="305" height="75" rx="5" fill="#f1f6f2"/><rect x="335" y="177" width="305" height="75" rx="5" fill="#f9eee4"/><text x="30" y="201" font-size="16" fill="#00695f" text-anchor="start" font-weight="700">题面 / 预测器能看</text><text x="30" y="231" font-size="17" fill="#193540" text-anchor="start" font-weight="400">位置 −0.1，时间 0.25</text><text x="351" y="201" font-size="16" fill="#ad492c" text-anchor="start" font-weight="700">答案 / 只在训练时对分</text><text x="351" y="231" font-size="17" fill="#193540" text-anchor="start" font-weight="400">速度 1.1 − (−0.5) = 1.6</text></svg>