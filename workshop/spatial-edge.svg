<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 313" role="img" aria-label="全片误差与遮罩变化区域误差" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>全片误差与遮罩变化区域误差</title><rect x="0" y="0" width="660" height="313" rx="0" fill="#fbfcf8"/><text x="15" y="28" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">先找两张遮罩哪里不同，再看那里的误差</text><image x="15" y="44" width="180" height="112.5" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAHklEQVR4nGNgGAUjFPwHg8Gj4T8SGDEaRsEoIB8AAPRvTbPeIzlPAAAAAElFTkSuQmCC"/><text x="105" y="178" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">本帧遮罩</text><image x="231" y="44" width="180" height="112.5" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAHklEQVR4nGNgGAUjEPwHg8Gj4T8SGDEaRsEooAwAACtVTbOMuVLcAAAAAElFTkSuQmCC"/><text x="321" y="178" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">上一帧遮罩</text><image x="447" y="44" width="180" height="112.5" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAIUlEQVR4nGNgGAUjEPwHAhg5GDQgqyNKz3DQMApGAWUAAAuJP8GeacUDAAAAAElFTkSuQmCC"/><text x="537" y="178" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">白色 = 发生变化</text><text x="15" y="215" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">同一张错位结果，两种误差统计</text><text x="14" y="252" font-size="14" fill="#193540" text-anchor="start" font-weight="400">全片所有像素</text><rect x="158" y="236" width="38.480852347260274" height="22" rx="2" fill="#00695f"/><text x="540" y="253" font-size="16" fill="#193540" text-anchor="start" font-weight="700">0.146</text><text x="14" y="292" font-size="14" fill="#193540" text-anchor="start" font-weight="400">仅遮罩变化像素</text><rect x="158" y="276" width="368.0" height="22" rx="2" fill="#ad492c"/><text x="540" y="293" font-size="16" fill="#193540" text-anchor="start" font-weight="700">1.394</text></svg>