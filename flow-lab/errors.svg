<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 261" role="img" aria-label="教师步数与一步学生在固定分位上的终点偏差" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>教师步数与一步学生在固定分位上的终点偏差</title><rect x="0" y="0" width="660" height="261" rx="0" fill="#fbfcf8"/><text x="14" y="26" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">学生每次只查一次表，两组学生用相同的训练端点</text><text x="136" y="57" font-size="15" fill="#00695f" text-anchor="start" font-weight="700">保留老师配对</text><rect x="136" y="75" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="136" y="75" width="147.55555677095975" height="15" rx="2" fill="#00695f"/><text x="308" y="88" font-size="14" fill="#00695f" text-anchor="start" font-weight="700">2.000</text><text x="13" y="88" font-size="14" fill="#193540" text-anchor="start" font-weight="400">老师 1 步</text><rect x="136" y="112" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="136" y="112" width="25.826675905510573" height="15" rx="2" fill="#00695f"/><text x="308" y="125" font-size="14" fill="#00695f" text-anchor="start" font-weight="700">0.350</text><text x="13" y="125" font-size="14" fill="#193540" text-anchor="start" font-weight="400">老师 4 步</text><rect x="136" y="149" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="136" y="149" width="7.319473004387398" height="15" rx="2" fill="#00695f"/><text x="308" y="162" font-size="14" fill="#00695f" text-anchor="start" font-weight="700">0.099</text><text x="13" y="162" font-size="14" fill="#193540" text-anchor="start" font-weight="400">老师 16 步</text><rect x="136" y="186" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="136" y="186" width="2.6433250767532512" height="15" rx="2" fill="#00695f"/><text x="308" y="199" font-size="14" fill="#00695f" text-anchor="start" font-weight="700">0.036</text><text x="13" y="199" font-size="14" fill="#193540" text-anchor="start" font-weight="400">老师 64 步</text><text x="391" y="57" font-size="15" fill="#ad492c" text-anchor="start" font-weight="700">打乱老师配对</text><rect x="391" y="75" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="391" y="75" width="147.55555677095975" height="15" rx="2" fill="#ad492c"/><text x="563" y="88" font-size="14" fill="#ad492c" text-anchor="start" font-weight="700">2.000</text><rect x="391" y="112" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="391" y="112" width="149.0098393636164" height="15" rx="2" fill="#ad492c"/><text x="563" y="125" font-size="14" fill="#ad492c" text-anchor="start" font-weight="700">2.020</text><rect x="391" y="149" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="391" y="149" width="149.2572086248888" height="15" rx="2" fill="#ad492c"/><text x="563" y="162" font-size="14" fill="#ad492c" text-anchor="start" font-weight="700">2.023</text><rect x="391" y="186" width="166" height="15" rx="2" fill="#f1f6f2"/><rect x="391" y="186" width="149.33169393549915" height="15" rx="2" fill="#ad492c"/><text x="563" y="199" font-size="14" fill="#ad492c" text-anchor="start" font-weight="700">2.024</text><text x="14" y="245" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">条长 = 到分位参考的平均绝对距离，越短越好。各栏共用 0 到 2.25 的尺度。</text></svg>