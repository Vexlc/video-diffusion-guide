<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 356" role="img" aria-label="相同查询次数下实际解码的六帧、查询时刻与最终进度" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>相同查询次数下实际解码的六帧、查询时刻与最终进度</title><rect x="0" y="0" width="660" height="356" rx="0" fill="#fbfcf8"/><text x="12" y="24" font-size="18" fill="#00695f" text-anchor="start" font-weight="700">同一份噪声，每排都问 4 次速度</text><text x="183" y="50" font-size="13" fill="#495f66" text-anchor="middle" font-weight="400">帧 0</text><text x="267" y="50" font-size="13" fill="#495f66" text-anchor="middle" font-weight="400">帧 1</text><text x="351" y="50" font-size="13" fill="#495f66" text-anchor="middle" font-weight="400">帧 2</text><text x="435" y="50" font-size="13" fill="#495f66" text-anchor="middle" font-weight="400">帧 3</text><text x="519" y="50" font-size="13" fill="#495f66" text-anchor="middle" font-weight="400">帧 4</text><text x="603" y="50" font-size="13" fill="#495f66" text-anchor="middle" font-weight="400">帧 5</text><text x="12" y="84" font-size="17" fill="#65777a" text-anchor="start" font-weight="700">24 步网格</text><text x="12" y="108" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">4 次更新</text><image x="150" y="61" width="66" height="49.5" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAAAAABOjGJdAAAAH0lEQVR4nGNgIA5M+1mBwjf793ctisCDf0JEGkUzAADrkwbWWuGWOwAAAABJRU5ErkJggg=="/><image x="234" y="61" width="66" height="49.5" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAAAAABOjGJdAAAAH0lEQVR4nGNgwA6Y0PjX/wehCnz7b4wqMOEdDqPoBgBe/wXRaYyKXwAAAABJRU5ErkJggg=="/><image x="318" y="61" width="66" height="49.5" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAAAAABOjGJdAAAAIUlEQVR4nGNgoB9gZkbl//u/AoXP8///BRQBjv//SDEfAOFcB4t8g/MdAAAAAElFTkSuQmCC"/><image x="402" y="61" width="66" height="49.5" style="image-rendering:pixelated" href="data:image/png;base6