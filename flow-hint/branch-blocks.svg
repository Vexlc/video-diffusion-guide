<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 247" role="img" aria-label="两个冻结 Transformer 块及对应的可训练副本，每个副本单独通过零初始化出口接入基座" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>两个冻结 Transformer 块及对应的可训练副本，每个副本单独通过零初始化出口接入基座</title><rect x="0" y="0" width="660" height="247" rx="0" fill="#fbfcf8"/><text x="12" y="25" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">两条路径同时读当前潜码、进度和方向</text><text x="12" y="78" font-size="15" fill="#00695f" text-anchor="start" font-weight="700">冻结基座</text><text x="12" y="188" font-size="15" fill="#ad492c" text-anchor="start" font-weight="700">训练支路</text><rect x="105" y="55" width="85" height="36" rx="4" fill="#e6f1ea"/><text x="147" y="79" font-size="16" fill="#00695f" text-anchor="middle" font-weight="700">块 1</text><line x1="190" y1="73" x2="245" y2="73" stroke="#00695f" stroke-width="2" stroke-dasharray="none"/><rect x="246" y="57" width="34" height="32" rx="4" fill="#d7ece2"/><text x="263" y="80" font-size="24" fill="#00695f" text-anchor="middle" font-weight="700">+</text><rect x="105" y="164" width="85" height="36" rx="4" fill="#f6e9dc"/><text x="147" y="188" font-size="16" fill="#ad492c" text-anchor="middle" font-weight="700">副本 1</text><line x1="190" y1="182" x2="263" y2="182" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><line x1="263" y1="182" x2="263" y2="147" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><rect x="211" y="118" width="104" height="29" rx="3" fill="#f6e9dc"/><text x="263" y="138" font-size="14" fill="#ad492c" text-anchor="middle" font-weight="700">零初始化出口</text><line x1="263" y1="118" x2="263" y2="91" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><path d="M259 98 l4 -7 l4 7" fill="none" stroke="#ad492c" stroke-width="2"/><text x="273" y="111" font-size="14" fill="#ad492c" text-anchor="start" font-weight="400">λr1</text><line x1="280" y1="73" x2="342" y2="73" stroke="#00695f" stroke-width="2" stroke-dasharray="none"/><path d="M336 69 l6 4 l-6 4" fill="none" stroke="#00695f" stroke-width="2"/><line x1="263" y1="182" x2="342" y2="182" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><path d="M336 178 l6 4 l-6 4" fill="none" stroke="#ad492c" stroke-width="2"/><rect x="345" y="55" width="85" height="36" rx="4" fill="#e6f1ea"/><text x="387" y="79" font-size="16" fill="#00695f" text-anchor="middle" font-weight="700">块 2</text><line x1="430" y1="73" x2="485" y2="73" stroke="#00695f" stroke-width="2" stroke-dasharray="none"/><rect x="486" y="57" width="34" height="32" rx="4" fill="#d7ece2"/><text x="503" y="80" font-size="24" fill="#00695f" text-anchor="middle" font-weight="700">+</text><rect x="345" y="164" width="85" height="36" rx="4" fill="#f6e9dc"/><text x="387" y="188" font-size="16" fill="#ad492c" text-anchor="middle" font-weight="700">副本 2</text><line x1="430" y1="182" x2="503" y2="182" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><line x1="503" y1="182" x2="503" y2="147" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><rect x="451" y="118" width="104" height="29" rx="3" fill="#f6e9dc"/><text x="503" y="138" font-size="14" fill="#ad492c" text-anchor="middle" font-weight="700">零初始化出口</text><line x1="503" y1="118" x2="503" y2="91" stroke="#ad492c" stroke-width="2" stroke-dasharray="none"/><path d="M499 98 l4 -7 l4 7" fill="none" stroke="#ad492c" stroke-width="2"/><text x="513" y="111" font-size="14" fill="#ad492c" text-anchor="start" font-weight="400">λr2</text><line x1="520" y1="73" x2="555" y2="73" stroke="#00695f" stroke-width="2" stroke-dasharray="none"/><text x="553" y="78" font-size="15" fill="#00695f" text-anchor="start" font-weight="700">→ 速度头</text><text x="12" y="231" font-size="15" fill="#495f66" text-anchor="start" font-weight="400">亮点图投影后送入第一个副本。副本之间传递隐藏特征，各自的出口向上交修正。</text></svg>