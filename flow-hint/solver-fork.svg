<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 267" role="img" aria-label="同一份速度场在半程出现两个数值终点及共同的第二次查询位置" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>同一份速度场在半程出现两个数值终点及共同的第二次查询位置</title><rect x="0" y="0" width="660" height="267" rx="0" fill="#fbfcf8"/><text x="12" y="26" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">固定视频块 8、潜码分量 0，看前半程</text><text x="12" y="53" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">标准化潜码</text><line x1="80" y1="64" x2="80" y2="206" stroke="#c8d7d0" stroke-width="1.5" stroke-dasharray="none"/><line x1="80" y1="206" x2="414" y2="206" stroke="#c8d7d0" stroke-width="1.5" stroke-dasharray="none"/><text x="72" y="195.91464957173542" font-size="12" fill="#495f66" text-anchor="end" font-weight="400">-0.429</text><line x1="80" y1="191.91464957173542" x2="410" y2="191.91464957173542" stroke="#c8d7d0" stroke-width="0.8" stroke-dasharray="none"/><text x="72" y="136.92683474634504" font-size="12" fill="#495f66" text-anchor="end" font-weight="400">-0.376</text><line x1="80" y1="132.92683474634504" x2="410" y2="132.92683474634504" stroke="#c8d7d0" stroke-width="0.8" stroke-dasharray="none"/><text x="72" y="85.3024205139175" font-size="12" fill="#495f66" text-anchor="end" font-weight="400">-0.329</text><line x1="80" y1="81.3024205139175" x2="410" y2="81.3024205139175" stroke="#c8d7d0" stroke-width="0.8" stroke-dasharray="none"/><text x="86" y="226" font-size="15" fill="#193540" text-anchor="middle" font-weight="400">0</text><text x="246" y="226" font-size="15" fill="#193540" text-anchor="middle" font-weight="400">¼</text><text x="406" y="226" font-size="15" fill="#193540" text-anchor="middle" font-weight="400">½</text><line x1="86" y1="191.91464957173542" x2="406" y2="88.66582110688036" stroke="#ad492c" stroke-width="2.2" stroke-dasharray="5 3"/><line x1="86" y1="191.91464957173542" x2="246" y2="132.92683474634504" stroke="#00695f" stroke-width="2.3" stroke-dasharray="none"/><line x1="246" y1="132.92683474634504" x2="406" y2="81.3024205139175" stroke="#00695f" stroke-width="2.3" stroke-dasharray="none"/><circle cx="86" cy="191.91464957173542" r="4" fill="#193540"/><circle cx="406" cy="81.3024205139175" r="4.5" fill="#00695f"/><rect x="402" y="84.66582110688036" width="8" height="8" rx="0" fill="#ad492c"/><path d="M246 125.92683474634504 l7 7 l-7 7 l-7 -7 Z" stroke="#ad492c" fill="white" stroke-width="2"/><circle cx="246" cy="132.92683474634504" r="3" fill="#00695f"/><text x="438" y="85" font-size="15" fill="#193540" text-anchor="start" font-weight="700">τ = ½ 时落在哪里？</text><text x="438" y="111" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">欧拉   -0.32894</text><text x="438" y="137" font-size="17" fill="#ad492c" text-anchor="start" font-weight="700">中点   -0.33559</text><text x="438" y="175" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">菱形是两者共同的</text><text x="438" y="196" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">第二次查询位置。</text><text x="12" y="254" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">横轴是生成进度 τ。线段只连接已接受的状态。中点法在 ¼ 处额外试探一次。</text></svg>