<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 407" role="img" aria-label="雪花盖住车以后，还认得出它吗？" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>雪花盖住车以后，还认得出它吗？</title><rect x="0" y="0" width="660" height="407" rx="0" fill="#fbfcf8"/><text x="20" y="32" font-size="19" fill="#00695f" text-anchor="start" font-weight="700">同一辆车　·　同一片雪花</text><text x="20" y="58" font-size="14" fill="#193540" text-anchor="start" font-weight="400">从左往右：车的信号越来越弱。上下两排看的是同一批像素。</text><text x="120" y="92" font-size="16" fill="#193540" text-anchor="middle" font-weight="700">噪声步 20</text><image x="32" y="107" width="176" height="110" style="image-rendering:pixelated" href="data:image/png;base64,"/><image x="32" y="254" width="176" height="110" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAYElEQVR4nO3NwQ2AIBBE0e1hSrEUe7LNaUXZYILKrMBJo//EJvOCTZ3ZDx4M6LUDUosaIANRAWQkTCyPvQwAKJb5CgBQiv0SIOUTcQ2C+dS2kFfqAu6yxfN307P/hy+CFce0ysRyMwlMAAAAAElFTkSuQmCC"/><text x="120" y="388" font-size="15" fill="#ad492c" text-anchor="middle" font-weight="400">像素偏差 0.048</text><text x="330" y="92" font-size="16" fill="#193540" text-anchor="middle" font-weight="700">噪声步 60</text><image x="242" y="107" width="176" height="110" style="image-rendering:pixelated" href="data:image/png;base64,"/><image x="242" y="254" width="176" height="110" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAXUlEQVR4nO3N0Q2AIBAD0G7iKO7knB1KaTBBQk/gS6P9upK+gGUw+MGDAZV+QHrRAmQgGoCMBMzympcBAMUytwAApTibAeoppk2CtcqxsE0vNbgLNkV31zn+wxfBDgh8Wx5XCBnpAAAAAElFTkSuQmCC"/><text x="330" y="388" font-size="15" fill="#ad492c" text-anchor="middle" font-weight="400">像素偏差 0.204</text><text x="540" y="92" font-size="16" fill="#193540" text-anchor="middle" font-weight="700">噪声步 90</text><image x="452" y="107" width="176" height="110" style="image-rendering:pixelated" href="data:image/png;base64,"/><image x="452