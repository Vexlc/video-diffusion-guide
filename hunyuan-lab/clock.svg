<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 293" role="img" aria-label="同样四次网络调用，三个shift怎样移动采样点" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>同样四次网络调用，三个shift怎样移动采样点</title><rect x="0" y="0" width="660" height="293" rx="0" fill="#fbfcf8"/><text x="16" y="27" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">四次问网络，五个 σ 边界</text><text x="155" y="57" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">噪声端 σ = 1</text><text x="633" y="57" font-size="14" fill="#495f66" text-anchor="end" font-weight="400">数据端 σ = 0</text><text x="14" y="100" font-size="16" fill="#193540" text-anchor="start" font-weight="700">shift = 1</text><line x1="155" y1="96" x2="633" y2="96" stroke="#c8d7d0" stroke-width="3" stroke-dasharray="none"/><circle cx="155.0" cy="96" r="5" fill="#00695f"/><circle cx="274.5" cy="96" r="5" fill="#00695f"/><circle cx="394.0" cy="96" r="5" fill="#00695f"/><circle cx="513.5" cy="96" r="5" fill="#00695f"/><circle cx="633.0" cy="96" r="5" fill="#ad492c"/><text x="155" y="120" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">1.000   →   0.750   →   0.500   →   0.250   →   0.000</text><text x="14" y="162" font-size="16" fill="#193540" text-anchor="start" font-weight="700">shift = 3</text><line x1="155" y1="158" x2="633" y2="158" stroke="#c8d7d0" stroke-width="3" stroke-dasharray="none"/><circle cx="155.0" cy="158" r="5" fill="#00695f"/><circle cx="202.79999999999998" cy="158" r="5" fill="#00695f"/><circle cx="274.5" cy="158" r="5" fill="#00695f"/><circle cx="394.0" cy="158" r="5" fill="#00695f"/><circle cx="633.0" cy="158" r="5" fill="#ad492c"/><text x="155" y="182" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">1.000   →   0.900   →   0.750   →   0.500   →   0.000</text><text x="14" y="224" font-size="16" fill="#193540" text-anchor="start" font-weight="700">shift = 9</text><line x1="155" y1="220" x2="633" y2="220" stroke="#c8d7d0" stroke-width="3" stroke-dasharray="none"/><circle cx="155.0" cy="220" r="5" fill="#00695f"/><circle cx="172.07142857142856" cy="220" r="5" fill="#00695f"/><circle cx="202.79999999999998" cy="220" r="5" fill="#00695f"/><circle cx="274.5" cy="220" r="5" fill="#00695f"/><circle cx="633.0" cy="220" r="5" fill="#ad492c"/><text x="155" y="244" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">1.000   →   0.964   →   0.900   →   0.750   →   0.000</text><text x="16" y="275" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">青点会发起网络查询，橙点是返回的终点。点的间距表示一次更新跨过的 σ 范围。</text></svg>