<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同一条路线，早开和晚开各答对几帧？</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#193540;background:#f0f4ee;font:17px/1.65 "MiSans","Microsoft YaHei",sans-serif}main{max-width:990px;margin:auto;padding:clamp(14px,3.5vw,36px)}h1,h2{font-family:"Noto Serif CJK SC",serif;line-height:1.35}h1{font-size:clamp(29px,4.5vw,46px)}h2{font-size:23px}a{color:#00695f}section{padding:clamp(12px,2.5vw,24px);background:#fffef9;margin:18px 0;border:1px solid #cbd8cd;border-radius:7px}fieldset{border:0;margin:0;padding:0}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}button,select,input{font:inherit}button,select{padding:4px 8px}button{cursor:pointer}.minor{font-size:14px;color:#476064}.panel{background:#ecf3ed;padding:11px;border-left:4px solid #007364}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}.list span{background:#f1f5ef;padding:6px 10px}svg{width:100%;max-width:680px;display:block}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:left;border-bottom:1px solid #cbd8ce;padding:.35em .5em}th{color:#22574e}.scroller{overflow:auto}code{overflow-wrap:anywhere}section:target{scroll-margin-top:12px}
.mapscroll{overflow-x:auto;margin:12px 0}.mapgrid{display:grid;grid-template-columns:3.2em repeat(var(--routes),minmax(14px,1fr));min-width:var(--minimum);gap:2px;align-items:center}.mapgrid .seed{font-size:12px;font-variant-numeric:tabular-nums}.mapgrid button{padding:0;min-width:0;height:19px;border:0;border-radius:2px}.mapgrid button[aria-pressed=true]{outline:2px solid #172e35;outline-offset:-1px;box-shadow:inset 0 0 0 3px white}.mapgrid button:focus-visible{outline:3px solid #191e88}.mapgrid button.dim{opacity:.31}.list i{display:inline-block;width:12px;height:12px;margin-right:6px}
</style><main>__NAV__<h1>同一条路线，早开和晚开各答对几帧？</h1>
<section id="paired"><h2>先挑一类结果，再看同一题</h2><p id="design"></p><div class="list" id="totals"></div>
<div class="controls"><label>配对成绩 <select id="filter"></select></label><label>题目 <select id="item"></select></label></div><div class="mapscroll"><div id="map" class="mapgrid" role="group" aria-label="按噪声种子和路线选题"></div></div><p class="minor">每格一题，每行一种子，路线编号从左到右。可点色格或用方向键换题。</p><p id="detail" class="panel" aria-live="polite"></p>
<div class="scroller"><table><thead><tr><th>位置支路</th><th>用提示的步数</th><th>整批全中段数</th><th>本题命中帧数</th></tr></thead><tbody id="counts"></tbody></table></div></section>
<section><h2>偏在第几帧？</h2><div class="controls"><label>影片帧 <input type="range" id="frame" min="0" max="5" value="0"> <output id="frameLabel"></output></label></div>
<svg id="plot" viewBox="0 0 548 173" role="img" aria-label="早开与晚开两排实测中心和同一帧的目标逐格比较"></svg><p class="minor">每块方格图宽 16 列、高 12 行，画的是中心坐标。空心橙框标目标，青点标按最亮的 3 × 3 窗口从解码影片中测出的中心。</p><p id="locations"></p>
<p>在解压包的 <code>reproduce</code> 目录复算当前题，只需 Python 标准库。</p><code id="recipe"></code></section></main>
<script type="application/json" id="record">__DATA__</script><script>
"use strict";
const d=JSON.parse(document.getElementById('record').textContent),el=id=>document.getElementById(id);
const keys=['off','early','late','full'],labels=['全程关闭','前段开启','后段开启','全程开启'];
const names={both:'两种都中',early:'仅前段中',late:'仅后段中',neither:'两种都偏'};
const colors={both:'#206b62',early:'#a4492c',late:'#3874a0',neither:'#d5d8cc'};
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1],coord=p=>'('+p.join(', ')+')',seeds=[...new Set(d.seeds)],routes=d.targets.length/seeds.length;
const hits=d.targets.map((tar,i)=>Object.fromEntries(keys.map(key=>[key,tar.filter((p,f)=>same(p,d.centers[key][i][f])).length])));
const category=hits.map(h=>h.early===6?(h.late===6?'both':'early'):(h.late===6?'late':'neither'));
el('design').textContent=seeds.length+' 份起始噪声 × '+routes+' 条路线，共 '+hits.length+' 题。早开与晚开各选 '+d.width+' 个生成步，窗口内强度 '+d.strength+'，方向标签在全程都提供。每题按六帧中心全部正确计一次。';
for(const [key,value] of Object.entries(names)){
 const n=category.filter(c=>c===key).length,tag=document.createElement('span');const swatch=document.createElement('i');swatch.style.backgroundColor=colors[key];tag.append(swatch,value+'　'+n);el('totals').append(tag);
 if(n)el('filter').add(new Option(value,key));
}
el('filter').add(new Option('看全部','all'),0);
const grid=el('map'),cells=[];
grid.style.setProperty('--routes',routes);grid.style.setProperty('--minimum',(56+16*routes)+'px');
const axisTitle=document.createElement('span');axisTitle.className='seed';axisTitle.textContent='种子';grid.append(axisTitle);
for(let col=0;col<routes;col++){
 const mark=document.createElement('span');mark.className='seed';mark.textContent=(col%4===0||col===routes-1)?col+1:'';grid.append(mark);
}
for(let i=0;i<category.length;i++){
 if(i%routes===0){const seed=document.createElement('span');seed.className='seed';seed.textContent=d.seeds[i];grid.append(seed)}
 const cell=document.createElement('button');cell.type='button';cell.style.backgroundColor=colors[category[i]];
 cell.title='种子 '+d.seeds[i]+'，路线 '+(i%routes+1)+'，'+names[category[i]];
 cell.setAttribute('aria-label',cell.title);cell.onclick=()=>pick(i);cells.push(cell);grid.append(cell);
 cell.onkeydown=e=>{const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-routes,ArrowDown:routes}[e.key];
  if(step===undefined)return;e.preventDefault();const next=Math.max(0,Math.min(cells.length-1,i+step));
  pick(next);cells[next].focus()};
}
function pick(i){
 if(el('filter').value!=='all'&&el('filter').value!==category[i]){el('filter').value='all';choose()}
 el('item').value=i;draw();
}
function draw(){
 const i=Number(el('item').value),f=Number(el('frame').value),p=d.targets[i][f];
 cells.forEach((cell,j)=>{cell.setAttribute('aria-pressed',String(i===j));cell.tabIndex=i===j?0:-1;cell.classList.toggle('dim',el('filter').value!=='all'&&category[j]!==el('filter').value)});
 el('frameLabel').value=f;el('detail').textContent='种子 '+d.seeds[i]+'，路线 '+(i%routes+1)+'，从 '+coord(d.targets[i][0])+' 向'+(d.targets[i][5][0]>d.targets[i][0][0]?'右':'左')+'。本题'+names[category[i]]+'。';
 el('counts').innerHTML=keys.map((k,j)=>'<tr><th>'+labels[j]+'</th><td>'+(d.windows[k][1]-d.windows[k][0])+' / '+d.steps+'</td><td>'+hits.filter(h=>h[k]===6).length+' / '+hits.length+'</td><td>'+hits[i][k]+' / 6</td></tr>').join('');
 let svg='',descs=[];
 for(const [j,k] of ['early','late'].entries()){
  const q=d.centers[k][i][f],left=22+j*266,top=29,cell=11;
  svg+='<text x="'+left+'" y="21" font-size="16" fill="#193540">'+labels[j+1]+'</text><rect x="'+left+'" y="'+top+'" width="176" height="132" fill="#edf3ed"/>';
  for(let c=0;c<=16;c++)svg+='<path d="M'+(left+c*cell)+' '+top+'v132" stroke="#cbd8ce"/>';
  for(let r=0;r<=12;r++)svg+='<path d="M'+left+' '+(top+r*cell)+'h176" stroke="#cbd8ce"/>';
  if(p[0]>=0&&p[0]<16&&p[1]>=0&&p[1]<12)svg+='<rect x="'+(left+p[0]*cell)+'" y="'+(top+p[1]*cell)+'" width="11" height="11" fill="none" stroke="#b04b2d" stroke-width="2.5"/>';
  svg+='<circle cx="'+(left+(q[0]+.5)*cell)+'" cy="'+(top+(q[1]+.5)*cell)+'" r="3.7" fill="#00695f"/>';descs.push(labels[j+1]+coord(q));
 }
 el('plot').innerHTML=svg;el('locations').textContent='帧 '+f+' 的目标 '+coord(p)+'。'+descs.join('，')+'。';
 el('recipe').textContent='python3 window_report.py'+(d.course?'':' --record 本次输出目录/windows.json')+' --case '+(i+1);
}
function choose(){
 const filter=el('filter').value,items=category.flatMap((v,i)=>filter==='all'||v===filter?[i]:[]);
 el('item').replaceChildren(...items.map(i=>new Option('种子 '+d.seeds[i]+' · 路线 '+(i%routes+1),i)));
 el('frame').value=0;draw();
}
el('filter').value=category.includes('early')?'early':'all';el('filter').onchange=choose;el('item').onchange=draw;el('frame').oninput=draw;choose();
</script></html>
