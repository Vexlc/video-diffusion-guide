<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 426" role="img" aria-label="点图在同一帧向右移四格，再比较接入支路与挪点的两种预测差" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>点图在同一帧向右移四格，再比较接入支路与挪点的两种预测差</title><rect x="0" y="0" width="660" height="426" rx="0" fill="#fbfcf8"/><text x="12" y="22" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">先看给模型的提示</text><text x="12" y="47" font-size="14" fill="#193540" text-anchor="start" font-weight="400">帧 2，行 5 不变</text><text x="12" y="71" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">点向右移四格</text><image x="171" y="7" width="88" height="66.0" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAIAAADkharWAAAAGklEQVR4nGN4//EFSYhheGpgyIwdbE4achoA5mAUHYnh0JgAAAAASUVORK5CYII="/><text x="215" y="91" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">(6, 5)</text><image x="356" y="7" width="88" height="66.0" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAIAAADkharWAAAAGklEQVR4nGN4//EFSYhh+GtgyIwdbE4aEhoA/ngUHWDJJ9kAAAAASUVORK5CYII="/><text x="400" y="91" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">(10, 5)</text><text x="298" y="50" font-size="24" fill="#00695f" text-anchor="middle" font-weight="700">→</text><text x="474" y="37" font-size="15" fill="#193540" text-anchor="start" font-weight="700">其余五帧</text><text x="474" y="62" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">沿用各自原来的点</text><g transform="translate(0 106)"><text x="12" y="24" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">固定带噪视频，看第 2 帧的预测差</text><text x="200" y="52" font-size="14" fill="#193540" text-anchor="middle" font-weight="700">更新 0 次</text><image x="160" y="64" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAIAAADkharWAAAAFUlEQVR4nGN4//EFSYhhVMOoBuwIAG93Fh+fv7wJAAAAAElFTkSuQmCC"/><text x="200" y="143" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">0</text><image x="160" y="156" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAIAAADkharWAAAAFUlEQVR4nGN4//EFSYhhVMOoBuwIAG93Fh+fv7wJAAAAAElFTkSuQmCC"/><text x="200" y="235" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">0</text><text x="319" y="52" font-size="14" fill="#193540" text-anchor="middle" font-weight="700">更新 1 次</text><image x="279" y="64" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="319" y="143" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">0.217</text><image x="279" y="156" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAIAAADkharWAAAAFUlEQVR4nGN4//EFSYhhVMOoBuwIAG93Fh+fv7wJAAAAAElFTkSuQmCC"/><text x="319" y="235" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">0</text><text x="438" y="52" font-size="14" fill="#193540" text-anchor="middle" font-weight="700">更新 2 次</text><image x="398" y="64" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="438" y="143" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">0.0762</text><image x="398" y="156" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAIAAADkharWAAAAFUlEQVR4nGN4//EFSYhhVMOoBuwIAG93Fh+fv7wJAAAAAElFTkSuQmCC"/><text x="438" y="235" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">5.27e-05</text><text x="557" y="52" font-size="14" fill="#193540" text-anchor="middle" font-weight="700">更新 3200 次</text><image x="517" y="64" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="557" y="143" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">2.27</text><image x="517" y="156" width="80" height="60.0" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="557" y="235" font-size="14" fill="#193540" text-anchor="middle" font-weight="400">1.52</text><text x="12" y="89" font-size="16" fill="#00695f" text-anchor="start" font-weight="700">接入支路</text><text x="12" y="112" font-size="12" fill="#495f66" text-anchor="start" font-weight="400">原提示预测 − 基座预测</text><text x="12" y="181" font-size="16" fill="#00695f" text-anchor="start" font-weight="700">移动一个点</text><text x="12" y="204" font-size="12" fill="#495f66" text-anchor="start" font-weight="400">新提示预测 − 原提示预测</text><image x="12" y="254" width="76" height="57.0" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="107" y="272" font-size="16" fill="#193540" text-anchor="start" font-weight="700">单独放大第 2 次更新的移点差</text><text x="107" y="297" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">把色阶上限从 1.52 降到 5.27e-05，细微的正负差才可见。</text></g></svg>