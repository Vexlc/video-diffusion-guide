<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 261" role="img" aria-label="细尺度和粗尺度的两条加法连接" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>细尺度和粗尺度的两条加法连接</title><rect x="0" y="0" width="660" height="261" rx="0" fill="#fbfcf8"/><text x="16" y="30" font-size="18" fill="#00695f" text-anchor="start" font-weight="700">一个采样步中，两个尺度分别接收一次修正</text><text x="16" y="75" font-size="15" fill="#00695f" text-anchor="start" font-weight="700">细尺度</text><text x="16" y="98" font-size="13" fill="#495f66" text-anchor="start" font-weight="400">12 × 16，16 通道</text><rect x="143" y="57" width="132" height="51" rx="7" fill="#f1f6f2"/><text x="209" y="87" font-size="15" fill="#193540" text-anchor="middle" font-weight="700">冻结基座特征</text><text x="290" y="90" font-size="22" fill="#00695f" text-anchor="middle" font-weight="700">+</text><rect x="309" y="57" width="182" height="51" rx="7" fill="#f7e9df"/><text x="400" y="79" font-size="15" fill="#ad492c" text-anchor="middle" font-weight="700">可训练副本的修正</text><text x="400" y="99" font-size="13" fill="#ad492c" text-anchor="middle" font-weight="400">1 × 1 出口 × 强度</text><text x="506" y="89" font-size="20" fill="#00695f" text-anchor="middle" font-weight="700">→</text><rect x="529" y="57" width="117" height="51" rx="7" fill="#f1f6f2"/><text x="588" y="89" font-size="14" fill="#00695f" text-anchor="middle" font-weight="700">送往解码器</text><text x="16" y="174" font-size="15" fill="#00695f" text-anchor="start" font-weight="700">粗尺度</text><text x="16" y="197" font-size="13" fill="#495f66" text-anchor="start" font-weight="400">6 × 8，32 通道</text><rect x="143" y="156" width="132" height="51" rx="7" fill="#f1f6f2"/><text x="209" y="186" font-size="15" fill="#193540" text-anchor="middle" font-weight="700">冻结基座特征</text><text x="290" y="189" font-size="22" fill="#00695f" text-anchor="middle" font-weight="700">+</text><rect x="309" y="156" width="182" height="51" rx="7" fill="#f7e9df"/><text x="400" y="178" font-size="15" fill="#ad492c" text-anchor="middle" font-weight="700">可训练副本的修正</text><text x="400" y="198" font-size="13" fill="#ad492c" text-anchor="middle" font-weight="400">1 × 1 出口 × 强度</text><text x="506" y="188" font-size="20" fill="#00695f" text-anchor="middle" font-weight="700">→</text><rect x="529" y="156" width="117" height="51" rx="7" fill="#f1f6f2"/><text x="588" y="188" font-size="14" fill="#00695f" text-anchor="middle" font-weight="700">送往解码器</text><line x1="16" y1="133" x2="644" y2="133" stroke="#c8d7d0" stroke-width="1" stroke-dasharray="none"/><text x="16" y="243" font-size="14" fill="#193540" text-anchor="start" font-weight="400">两行都读同一段六帧影片。从左向右算，每个位置的各个通道分别相加。</text></svg>