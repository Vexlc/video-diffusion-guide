<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 267" role="img" aria-label="两次加噪与用合并雪花一次直达的逐像素比较" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>两次加噪与用合并雪花一次直达的逐像素比较</title><rect x="0" y="0" width="660" height="267" rx="0" fill="#fbfcf8"/><text x="12" y="25" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">同一辆车，沿橙框跟踪车身的一格</text><text x="10" y="54" font-size="14" fill="#193540" text-anchor="start" font-weight="700">最初的车</text><image x="10" y="68" width="120" height="75" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAYElEQVR4nO3NwQ2AIBBE0W1jSrEUe7LOqUPZYILKrMBJo//EJvOCTZ3ZDx4M6LUDUosaIANRAWQkTCyPvQwAKJb5CgBQiv0SIOUTcQ2C+dS2kFfqAu6yxfN307P/hy+CFbJ17TRqiRbtAAAAAElFTkSuQmCC"/><rect x="67.5" y="103" width="8" height="8" fill="none" stroke="#ff6a35" stroke-width="1.8"/><text x="70" y="165" font-size="15" fill="#193540" text-anchor="middle" font-weight="700">+0.8000</text><text x="140" y="54" font-size="14" fill="#193540" text-anchor="start" font-weight="700">第一层</text><image x="140" y="68" width="120" height="75" style="image-rendering:pixelated" href="data:image/png;base64,"/><rect x="197.5" y="103" width="8" height="8" fill="none" stroke="#ff6a35" stroke-width="1.8"/><text x="200" y="165" font-size="15" fill="#193540" text-anchor="middle" font-weight="700">+0.0400</text><text x="270" y="54" font-size="14" fill="#193540" text-anchor="start" font-weight="700">第二层 · 逐步</text><image x="270" y="68" width="120" height="75" style="image-rendering:pixelated" href="data:image/png;base64,"/><rect x="327.5" y="103" width="8" height="8" fill="none" stroke="#ff6a35" stroke-width="1.8"/><text x="330" y="165" font-size="15" fill="#00695f" text-anchor="middle" font-weight="700">+0.6914</text><text x="400" y="54" font-size="14" fill="#193540" text-anchor="start" font-weight="700">第二层 · 合并</text><image x="400" y="68" width="120" height="75" style="image-rendering:pixelated" href="data:image/png;base64,"/><rect x="457.5" y="103" width="8" height="8" fill="none" stroke="#ff6a35" stroke-width="1.8"/><text x="460" y="165" font-size="15" fill="#00695f" text-anchor="middle" font-weight="700">+0.6914</text><text x="530" y="54" font-size="14" fill="#193540" text-anchor="start" font-weight="700">第二层 · 沿用 ε₁</text><image x="530" y="68" width="120" height="75" style="image-rendering:pixelated" href="data:image/png;base64,"/><rect x="587.5" y="103" width="8" height="8" fill="none" stroke="#ff6a35" stroke-width="1.8"/><text x="590" y="165" font-size="15" fill="#193540" text-anchor="middle" font-weight="700">-0.3200</text><rect x="10" y="182" width="640" height="76" rx="4" fill="#f1f6f2"/><text x="21" y="204" font-size="15" fill="#193540" text-anchor="start" font-weight="400">第一次的雪花 ε₁ = -1.000，走到第二层时还留下 -0.4500</text><text x="21" y="227" font-size="15" fill="#193540" text-anchor="start" font-weight="400">第二次的雪花 ε₂ = +1.000，这一步新加 +0.6614</text><text x="21" y="250" font-size="15" fill="#00695f" text-anchor="start" font-weight="700">两项相加再除以总噪声幅度 0.8000，得到合并雪花 +0.2643</text></svg>