<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 161" role="img" aria-label="DDPM 与确定性 DDIM 从同一起点取下一格，三列只改变新噪声" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>DDPM 与确定性 DDIM 从同一起点取下一格，三列只改变新噪声</title><rect x="0" y="0" width="660" height="161" rx="0" fill="#fbfcf8"/><text x="14" y="25" font-size="17" fill="#00695f" text-anchor="start" font-weight="700">同一个 x = 0.04，重走三次</text><text x="272" y="51" font-size="14" fill="#495f66" text-anchor="middle" font-weight="400">新噪声 ξ = -1</text><text x="416" y="51" font-size="14" fill="#495f66" text-anchor="middle" font-weight="400">新噪声 ξ = +0</text><text x="560" y="51" font-size="14" fill="#495f66" text-anchor="middle" font-weight="400">新噪声 ξ = +1</text><text x="14" y="82" font-size="16" fill="#193540" text-anchor="start" font-weight="700">DDPM</text><text x="14" y="100" font-size="13" fill="#495f66" text-anchor="start" font-weight="400">同一中心，再抽一次</text><rect x="223" y="65" width="36" height="32" rx="2" fill="rgb(102,102,102)"/><text x="266" y="87" font-size="16" fill="#ad492c" text-anchor="start" font-weight="700">-0.1982</text><rect x="367" y="65" width="36" height="32" rx="2" fill="rgb(135,135,135)"/><text x="410" y="87" font-size="16" fill="#ad492c" text-anchor="start" font-weight="700">+0.0597</text><rect x="511" y="65" width="36" height="32" rx="2" fill="rgb(168,168,168)"/><text x="554" y="87" font-size="16" fill="#ad492c" text-anchor="start" font-weight="700">+0.3177</text><text x="14" y="131" font-size="16" fill="#193540" text-anchor="start" font-weight="700">DDIM（η = 0）</text><text x="14" y="149" font-size="13" fill="#495f66" text-anchor="start" font-weight="400">固定起点，确定一步</text><rect x="223" y="114" width="36" height="32" rx="2" fill="rgb(135,135,135)"/><text x="266" y="136" font-size="16" fill="#00695f" text-anchor="start" font-weight="700">+0.0565</text><rect x="367" y="114" width="36" height="32" rx="2" fill="rgb(135,135,135)"/><text x="410" y="136" font-size="16" fill="#00695f" te