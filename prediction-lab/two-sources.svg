<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 151" role="img" aria-label="车身和背景两种干净值都能产生0.04，等先验下两种解释的概率" font-family="MiSans, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title>车身和背景两种干净值都能产生0.04，等先验下两种解释的概率</title><rect x="0" y="0" width="660" height="151" rx="0" fill="#fbfcf8"/><text x="16" y="20" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">可能的干净来源</text><text x="216" y="20" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">得到同一读数的两种配方</text><text x="478" y="20" font-size="14" fill="#495f66" text-anchor="start" font-weight="400">看到 0.04 后的权重</text><image x="16" y="31" width="80" height="50" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAYElEQVR4nO3NwQ2AIBBE0W1jSrEUe7LOqUPZYILKrMBJo//EJvOCTZ3ZDx4M6LUDUosaIANRAWQkTCyPvQwAKJb5CgBQiv0SIOUTcQ2C+dS2kFfqAu6yxfN307P/hy+CFbJ17TRqiRbtAAAAAElFTkSuQmCC" style="image-rendering:pixelated"/><rect x="54.0" y="54.0" width="6" height="6" fill="none" stroke="#ff982e" stroke-width="2"/><text x="109" y="51" font-size="16" fill="#00695f" text-anchor="start" font-weight="700">车身</text><text x="109" y="72" font-size="14" fill="#193540" text-anchor="start" font-weight="400">y = +0.80</text><text x="216" y="61" font-size="15" fill="#193540" text-anchor="start" font-weight="400">0.8 × (+0.80) + 0.6 × (-1.0)</text><text x="438" y="61" font-size="18" fill="#495f66" text-anchor="start" font-weight="400">→</text><rect x="478" y="60" width="144" height="9" rx="0" fill="#dae2dc"/><rect x="478" y="60" width="65.53743949820448" height="9" rx="0" fill="#00695f"/><text x="478" y="52" font-size="16" fill="#00695f" text-anchor="start" font-weight="700">45.5%</text><image x="16" y="95" width="80" height="50" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAeCAAAAABPz8IdAAAAYElEQVR4nO3NwQ2AIBBE0W1jSrEUe7LOqUPZYILKrMBJo//EJvOCTZ3ZDx4M6LUDUosaIANRAWQkTCyPvQwAKJb5CgBQiv0SIOUTcQ2C+dS2kFfqAu6yxfN307P/hy+CFbJ17TRqiRbtAAAAAElFTkSuQmCC" style="image-rendering:pixelated"/><rect x="54.0" y="101.33333333333333" width="6" height="6" fill="none" stroke="#ff982e" stroke-width="2"/><text x="109" y="115" font-size="16" fill="#ad492c" text-anchor="start" font-weight="700">背景</text><text x="109" y="136" font-size="14" fill="#193540" text-anchor="start" font-weight="400">y = -0.55</text><text x="216" y="125" font-size="15" fill="#193540" text-anchor="start" font-weight="400">0.8 × (-0.55) + 0.6 × (+0.8)</text><text x="438" y="125" font-size="18" fill="#495f66" text-anchor="start" font-weight="400">→</text><rect x="478" y="124" width="144" height="9" rx="0" fill="#dae2dc"/><rect x="478" y="124" width="78.46256050179554" height="9" rx="0" fill="#ad492c"/><text x="478" y="116" font-size="16" fill="#ad492c" text-anchor="start" font-weight="700">54.5%</text></svg>